name: Validate promotion path

on:
  pull_request:
    branches:
      - dev
      - test
      - prod

jobs:
  validate-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Validate source and target branch
        shell: bash
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          echo "PR: $SOURCE -> $TARGET"

          if [[ "$TARGET" == "dev" ]]; then
            if [[ "$SOURCE" != feature/* && "$SOURCE" != fix/* && "$SOURCE" != hotfix/* ]]; then
              echo "ERROR: dev only accepts feature/*, fix/*, or hotfix/* branches."
              exit 1
            fi

          elif [[ "$TARGET" == "test" ]]; then
            if [[ "$SOURCE" != "dev" ]]; then
              echo "ERROR: test only accepts promotions from dev."
              exit 1
            fi

          elif [[ "$TARGET" == "prod" ]]; then
            if [[ "$SOURCE" != "test" ]]; then
              echo "ERROR: prod only accepts promotions from test."
              exit 1
            fi
          fi

          echo "Promotion path is valid."
